# Runs the tests of every project in the repository. A project is the outermost
# directory with a manifest of its language; see scripts/find_test_projects.py.
# The toolchains are set up as in A2UI's CI, with A2UI's own composite actions
# where it has one.
name: Presubmit Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  find-projects:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.find.outputs.node }}
      python: ${{ steps.find.outputs.python }}
      dart: ${{ steps.find.outputs.dart }}
      swift: ${{ steps.find.outputs.swift }}
      kotlin: ${{ steps.find.outputs.kotlin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the projects to test
        id: find
        # With an explicit bash shell, pipefail is on, so a failing script fails the step.
        shell: bash
        run: ./scripts/find_test_projects.py | tee -a "$GITHUB_OUTPUT"

  node:
    name: node (${{ matrix.project.path }})
    needs: find-projects
    if: needs.find-projects.outputs.node != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.find-projects.outputs.node) }}
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the latest A2UI main
        working-directory: .
        run: git submodule update --init --remote --depth 1 third_party/a2ui
      - uses: ./third_party/a2ui/.github/actions/setup-node
        with:
          node-version: ${{ matrix.project.node-version }}
          install: false
      - name: Install dependencies
        run: |
          if [ -f yarn.lock ]; then
            yarn install --immutable
          elif [ -f pnpm-lock.yaml ]; then
            corepack pnpm install --frozen-lockfile
          else
            npm ci
          fi
      - name: Test
        run: |
          if [ -f yarn.lock ]; then
            yarn test
          elif [ -f pnpm-lock.yaml ]; then
            corepack pnpm test
          else
            npm test
          fi

  python:
    name: python (${{ matrix.project.path }})
    needs: find-projects
    if: needs.find-projects.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.find-projects.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the latest A2UI main
        working-directory: .
        run: git submodule update --init --remote --depth 1 third_party/a2ui
      - uses: ./third_party/a2ui/.github/actions/setup-python
      - name: Test
        # pytest exits with 5 when the project has no tests.
        run: uv run --with pytest pytest || [ $? -eq 5 ]

  dart:
    name: dart (${{ matrix.project.path }})
    needs: find-projects
    if: needs.find-projects.outputs.dart != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.find-projects.outputs.dart) }}
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the latest A2UI main
        working-directory: .
        run: git submodule update --init --remote --depth 1 third_party/a2ui
      - uses: ./third_party/a2ui/.github/actions/setup-dart
      - name: Test
        run: |
          flutter pub get
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory. Skipping."
          fi

  swift:
    name: swift (${{ matrix.project.path }})
    needs: find-projects
    if: needs.find-projects.outputs.swift != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.find-projects.outputs.swift) }}
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: swift test

  kotlin:
    name: kotlin (${{ matrix.project.path }})
    needs: find-projects
    if: needs.find-projects.outputs.kotlin != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.find-projects.outputs.kotlin) }}
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test
