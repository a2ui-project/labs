name: Presubmit Plugin (a2ui-pane)

on:
  push:
    branches: [main]
    paths:
      - "plugin/a2ui-pane/**"
      - ".github/workflows/presubmit-plugin-a2ui-pane.yml"
  pull_request:
    paths:
      - "plugin/a2ui-pane/**"
      - ".github/workflows/presubmit-plugin-a2ui-pane.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/a2ui-pane
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the latest A2UI main
        working-directory: .
        run: git submodule update --init --remote --depth 1 third_party/a2ui

      - uses: ./third_party/a2ui/.github/actions/setup-node
        with:
          node-version: "22"
          install: false

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Run linter
        run: yarn lint
