# Conformance cases for the craft_binary_format feature
# (blueprints/features/craft_binary_format.blueprint.md).
#
# Every case has a `name`, a `description`, the `features` it exercises (IDs
# from conformance/features.yaml) and an `action`; conformance_schema.json
# lists the fields of each action.
#
# A blob is written in `hex`: bytes as pairs of hex digits separated by
# whitespace. A `#` starts a comment that runs to the end of the line; the
# comments give each field's decimal offset and meaning.
#
# action: decode_library, decode_data   decodes `hex` as a library blob or a
#   data blob. `expect` is one of:
#     library: the canonical JSON form of the decoded library (see
#       craft_text_format);
#     data: the canonical JSON form of the decoded data value;
#     source: the decoded library has the canonical form of this library
#       source;
#     error: the blob is rejected with this `kind` at this byte `offset`;
#       the error also reports the blob's `version` (null when it was not
#       read yet) and, for unknownTag and unexpectedTag, the `tag`.
#
# action: encode_library, encode_data   parses `source` as a library file or
#   a data file and encodes it. `expect` is one of:
#     hex: the exact blob. Decoding it gives the canonical form of the parsed
#       source, or `decoded` when given, and encoding the decoded result
#       gives the same blob again;
#     error: the encoder rejects the source.

- name: integers
  action: encode_data
  features: [F-CRAFT-BIN-01]
  description: "Integers, including negative ones and one that needs more than 32 bits, are int64."
  source: |
    { small: 1, negative: -1, large: 9007199254730661, hex: 0x10 }
  expect:
    hex: |
      fe 43 52 44                                      # 0: data signature
      01 00                                            # 4: version 1
      01 00                                            # 6: minimum reader version 1
      07                                               # 8: map
      04 00 00 00 00 00 00 00                          # 9: 4 entries
      05 00 00 00 00 00 00 00 73 6d 61 6c 6c           # 17:   key "small"
      02                                               # 30:   integer
      01 00 00 00 00 00 00 00                          # 31:   1
      08 00 00 00 00 00 00 00 6e 65 67 61 74 69 76 65  # 39:   key "negative"
      02                                               # 55:   integer
      ff ff ff ff ff ff ff ff                          # 56:   -1
      05 00 00 00 00 00 00 00 6c 61 72 67 65           # 64:   key "large"
      02                                               # 77:   integer
      a5 d7 ff ff ff ff 1f 00                          # 78:   9007199254730661
      03 00 00 00 00 00 00 00 68 65 78                 # 86:   key "hex"
      02                                               # 97:   integer
      10 00 00 00 00 00 00 00                          # 98:   16
- name: integer_extremes
  action: decode_data
  features: [F-CRAFT-BIN-01]
  description: "The smallest and largest int64."
  hex: |
    fe 43 52 44              # 0: data signature
    01 00                    # 4: version 1
    01 00                    # 6: minimum reader version 1
    05                       # 8: list
    02 00 00 00 00 00 00 00  # 9: 2 elements
    02                       # 17:   integer
    00 00 00 00 00 00 00 80  # 18:   -2^63
    02                       # 26:   integer
    ff ff ff ff ff ff ff 7f  # 27:   2^63 - 1
  expect:
    data:
      - {$: int, value: -9223372036854775808}
      - {$: int, value: 9223372036854775807}
- name: doubles
  action: encode_data
  features: [F-CRAFT-BIN-01]
  description: "Doubles are binary64; a whole number written as a double stays a double."
  source: |
    { quarter: 0.25, whole: 1.0, negative: -2.5 }
  expect:
    hex: |
      fe 43 52 44                                      # 0: data signature
      01 00                                            # 4: version 1
      01 00                                            # 6: minimum reader version 1
      07                                               # 8: map
      03 00 00 00 00 00 00 00                          # 9: 3 entries
      07 00 00 00 00 00 00 00 71 75 61 72 74 65 72     # 17:   key "quarter"
      03                                               # 32:   double
      00 00 00 00 00 00 d0 3f                          # 33:   0.25
      05 00 00 00 00 00 00 00 77 68 6f 6c 65           # 41:   key "whole"
      03                                               # 54:   double
      00 00 00 00 00 00 f0 3f                          # 55:   1.0
      08 00 00 00 00 00 00 00 6e 65 67 61 74 69 76 65  # 63:   key "negative"
      03                                               # 79:   double
      00 00 00 00 00 00 04 c0                          # 80:   -2.5
- name: multibyte_strings
  action: encode_data
  features: [F-CRAFT-BIN-01]
  description: "Strings are UTF-8: two-, three- and four-byte sequences."
  source: |
    { text: "\u00E9\u20AC\uD83D\uDE00" }
  expect:
    hex: |
      fe 43 52 44                                      # 0: data signature
      01 00                                            # 4: version 1
      01 00                                            # 6: minimum reader version 1
      07                                               # 8: map
      01 00 00 00 00 00 00 00                          # 9: 1 entry
      04 00 00 00 00 00 00 00 74 65 78 74              # 17:   key "text"
      04                                               # 29:   string
      09 00 00 00 00 00 00 00 c3 a9 e2 82 ac f0 9f 98 80  # 30:   string "\u00e9\u20ac\ud83d\ude00"
- name: byte_order_mark_is_kept
  action: decode_data
  features: [F-CRAFT-BIN-01]
  description: "A leading byte order mark decodes to U+FEFF and is not dropped."
  hex: |
    fe 43 52 44              # 0: data signature
    01 00                    # 4: version 1
    01 00                    # 6: minimum reader version 1
    04                       # 8: string
    04 00 00 00 00 00 00 00  # 9: length 4
    ef bb bf 61              # 17: byte order mark, then "a"
  expect: {data: "\uFEFFa"}
- name: encoded_surrogate_is_rejected
  action: decode_data
  features: [F-CRAFT-BIN-01]
  description: "An encoded surrogate is not well-formed UTF-8."
  hex: |
    fe 43 52 44              # 0: data signature
    01 00                    # 4: version 1
    01 00                    # 6: minimum reader version 1
    04                       # 8: string
    03 00 00 00 00 00 00 00  # 9: length 3
    ed a0 80                 # 17: U+D800 encoded as three bytes
  expect:
    error:
      kind: invalidUtf8
      offset: 17
      version: 1
- name: overlong_form_is_rejected
  action: decode_data
  features: [F-CRAFT-BIN-01]
  description: "An overlong form is not well-formed UTF-8."
  hex: |
    fe 43 52 44              # 0: data signature
    01 00                    # 4: version 1
    01 00                    # 6: minimum reader version 1
    04                       # 8: string
    02 00 00 00 00 00 00 00  # 9: length 2
    c0 80                    # 17: U+0000 in an overlong two-byte form
  expect:
    error:
      kind: invalidUtf8
      offset: 17
      version: 1
- name: code_point_above_the_range_is_rejected
  action: decode_data
  features: [F-CRAFT-BIN-01]
  description: "A code point above U+10FFFF is not well-formed UTF-8."
  hex: |
    fe 43 52 44              # 0: data signature
    01 00                    # 4: version 1
    01 00                    # 6: minimum reader version 1
    04                       # 8: string
    04 00 00 00 00 00 00 00  # 9: length 4
    f4 90 80 80              # 17: U+110000, above U+10FFFF
  expect:
    error:
      kind: invalidUtf8
      offset: 17
      version: 1
- name: double_part_is_rejected
  action: decode_library
  features: [F-CRAFT-BIN-01]
  description: "A part is an integer or a string; a double is rejected."
  hex: |
    fe 43 52 46                          # 0: library signature
    01 00                                # 4: version 1
    01 00                                # 6: minimum reader version 1
    01 00 00 00 00 00 00 00              # 8: 1 import
    01 00 00 00 00 00 00 00              # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65  # 24:   string "core"
    01 00 00 00 00 00 00 00              # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74  # 44:   name "root"
    00 00 00 00 00 00 00 00              # 56:   flags 0x0
    00 00 00 00 00 00 00 00              # 64:   no initial state
    09                                   # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74  # 73:     name "Text"
    01 00 00 00 00 00 00 00              # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74  # 93:       key "text"
    0a                                   # 105:       argsRef
    01 00 00 00 00 00 00 00              # 106:       1 part
    03                                   # 114:       double: not a part
    00 00 00 00 00 00 f0 3f              # 115:       1.0
  expect:
    error:
      kind: unexpectedTag
      offset: 114
      tag: 0x03
      version: 1
- name: library_v1_minimal
  action: decode_library
  features: [F-CRAFT-BIN-02]
  description: "A library blob at version 1."
  hex: |
    fe 43 52 46                             # 0: library signature
    01 00                                   # 4: version 1
    01 00                                   # 6: minimum reader version 1
    01 00 00 00 00 00 00 00                 # 8: 1 import
    01 00 00 00 00 00 00 00                 # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65     # 24:   string "core"
    01 00 00 00 00 00 00 00                 # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74     # 44:   name "root"
    00 00 00 00 00 00 00 00                 # 56:   flags 0x0
    00 00 00 00 00 00 00 00                 # 64:   no initial state
    09                                      # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74     # 73:     name "Text"
    01 00 00 00 00 00 00 00                 # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74     # 93:       key "text"
    04                                      # 105:       string
    05 00 00 00 00 00 00 00 48 65 6c 6c 6f  # 106:       string "Hello"
  expect:
    library:
      imports: [core]
      widgets:
        - name: root
          root:
            $: call
            name: Text
            args: {text: Hello}
- name: library_higher_version_is_readable
  action: decode_library
  features: [F-CRAFT-BIN-02]
  description: "Version 2 with minimum reader version 1 decodes by the rules for version 1."
  hex: |
    fe 43 52 46                             # 0: library signature
    02 00                                   # 4: version 2
    01 00                                   # 6: minimum reader version 1
    01 00 00 00 00 00 00 00                 # 8: 1 import
    01 00 00 00 00 00 00 00                 # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65     # 24:   string "core"
    01 00 00 00 00 00 00 00                 # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74     # 44:   name "root"
    00 00 00 00 00 00 00 00                 # 56:   flags 0x0
    00 00 00 00 00 00 00 00                 # 64:   no initial state
    09                                      # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74     # 73:     name "Text"
    01 00 00 00 00 00 00 00                 # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74     # 93:       key "text"
    04                                      # 105:       string
    05 00 00 00 00 00 00 00 48 65 6c 6c 6f  # 106:       string "Hello"
  expect:
    library:
      imports: [core]
      widgets:
        - name: root
          root:
            $: call
            name: Text
            args: {text: Hello}
- name: library_minimum_reader_version_too_high
  action: decode_library
  features: [F-CRAFT-BIN-02]
  description: "Minimum reader version 2 is rejected before the library is read."
  hex: |
    fe 43 52 46                             # 0: library signature
    02 00                                   # 4: version 2
    02 00                                   # 6: minimum reader version 2
    01 00 00 00 00 00 00 00                 # 8: 1 import
    01 00 00 00 00 00 00 00                 # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65     # 24:   string "core"
    01 00 00 00 00 00 00 00                 # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74     # 44:   name "root"
    00 00 00 00 00 00 00 00                 # 56:   flags 0x0
    00 00 00 00 00 00 00 00                 # 64:   no initial state
    09                                      # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74     # 73:     name "Text"
    01 00 00 00 00 00 00 00                 # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74     # 93:       key "text"
    04                                      # 105:       string
    05 00 00 00 00 00 00 00 48 65 6c 6c 6f  # 106:       string "Hello"
  expect:
    error:
      kind: unsupportedVersion
      offset: 6
      version: 2
- name: header_version_zero
  action: decode_library
  features: [F-CRAFT-BIN-02]
  description: "A Craft signature needs version 1 or higher."
  hex: |
    fe 43 52 46                             # 0: library signature
    00 00                                   # 4: version 0
    00 00                                   # 6: minimum reader version 0
    01 00 00 00 00 00 00 00                 # 8: 1 import
    01 00 00 00 00 00 00 00                 # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65     # 24:   string "core"
    01 00 00 00 00 00 00 00                 # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74     # 44:   name "root"
    00 00 00 00 00 00 00 00                 # 56:   flags 0x0
    00 00 00 00 00 00 00 00                 # 64:   no initial state
    09                                      # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74     # 73:     name "Text"
    01 00 00 00 00 00 00 00                 # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74     # 93:       key "text"
    04                                      # 105:       string
    05 00 00 00 00 00 00 00 48 65 6c 6c 6f  # 106:       string "Hello"
  expect:
    error:
      kind: invalidHeader
      offset: 4
      version: 0
- name: header_minimum_reader_version_zero
  action: decode_library
  features: [F-CRAFT-BIN-02]
  description: "The minimum reader version must be 1 or higher."
  hex: |
    fe 43 52 46                             # 0: library signature
    01 00                                   # 4: version 1
    00 00                                   # 6: minimum reader version 0
    01 00 00 00 00 00 00 00                 # 8: 1 import
    01 00 00 00 00 00 00 00                 # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65     # 24:   string "core"
    01 00 00 00 00 00 00 00                 # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74     # 44:   name "root"
    00 00 00 00 00 00 00 00                 # 56:   flags 0x0
    00 00 00 00 00 00 00 00                 # 64:   no initial state
    09                                      # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74     # 73:     name "Text"
    01 00 00 00 00 00 00 00                 # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74     # 93:       key "text"
    04                                      # 105:       string
    05 00 00 00 00 00 00 00 48 65 6c 6c 6f  # 106:       string "Hello"
  expect:
    error:
      kind: invalidHeader
      offset: 4
      version: 1
- name: header_minimum_reader_version_above_version
  action: decode_library
  features: [F-CRAFT-BIN-02]
  description: "The minimum reader version must not exceed the version (here 2 > 1, which is also more than this decoder reads: invalidHeader comes first)."
  hex: |
    fe 43 52 46                             # 0: library signature
    01 00                                   # 4: version 1
    02 00                                   # 6: minimum reader version 2
    01 00 00 00 00 00 00 00                 # 8: 1 import
    01 00 00 00 00 00 00 00                 # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65     # 24:   string "core"
    01 00 00 00 00 00 00 00                 # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74     # 44:   name "root"
    00 00 00 00 00 00 00 00                 # 56:   flags 0x0
    00 00 00 00 00 00 00 00                 # 64:   no initial state
    09                                      # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74     # 73:     name "Text"
    01 00 00 00 00 00 00 00                 # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74     # 93:       key "text"
    04                                      # 105:       string
    05 00 00 00 00 00 00 00 48 65 6c 6c 6f  # 106:       string "Hello"
  expect:
    error:
      kind: invalidHeader
      offset: 4
      version: 1
- name: unknown_signature
  action: decode_library
  features: [F-CRAFT-BIN-02]
  description: "Four bytes that are no signature."
  hex: |
    fe 52 46 58  # 0: not a signature
    00 00 00 00  # 4: four more bytes
  expect:
    error:
      kind: signature
      offset: 0
      version: null
- name: data_signature_in_a_library_decoder
  action: decode_library
  features: [F-CRAFT-BIN-02]
  description: "A data blob is not a library blob."
  hex: |
    fe 43 52 44  # 0: data signature
    01 00        # 4: version 1
    01 00        # 6: minimum reader version 1
    01           # 8: true
  expect:
    error:
      kind: signature
      offset: 0
      version: null
- name: rfw_data_signature_in_a_library_decoder
  action: decode_library
  features: [F-CRAFT-BIN-02]
  description: "An RFW data blob is not a library blob either."
  hex: |
    fe 52 57 44  # 0: RFW data signature
    01           # 4: true
  expect:
    error:
      kind: signature
      offset: 0
      version: null
- name: data_v1
  action: decode_data
  features: [F-CRAFT-BIN-02]
  description: "A data blob at version 1."
  hex: |
    fe 43 52 44                 # 0: data signature
    01 00                       # 4: version 1
    01 00                       # 6: minimum reader version 1
    07                          # 8: map
    02 00 00 00 00 00 00 00     # 9: 2 entries
    01 00 00 00 00 00 00 00 61  # 17:   key "a"
    02                          # 26:   integer
    01 00 00 00 00 00 00 00     # 27:   1
    01 00 00 00 00 00 00 00 62  # 35:   key "b"
    05                          # 44:   list
    03 00 00 00 00 00 00 00     # 45:   3 elements
    01                          # 53:     true
    03                          # 54:     double
    00 00 00 00 00 00 04 40     # 55:     2.5
    04                          # 63:     string
    01 00 00 00 00 00 00 00 78  # 64:     string "x"
  expect:
    data:
      a: {$: int, value: 1}
      b:
        - true
        - {$: double, value: 2.5}
        - x
- name: data_higher_version_is_readable
  action: decode_data
  features: [F-CRAFT-BIN-02]
  description: "A data blob of version 3 with minimum reader version 1."
  hex: |
    fe 43 52 44                 # 0: data signature
    03 00                       # 4: version 3
    01 00                       # 6: minimum reader version 1
    07                          # 8: map
    02 00 00 00 00 00 00 00     # 9: 2 entries
    01 00 00 00 00 00 00 00 61  # 17:   key "a"
    02                          # 26:   integer
    01 00 00 00 00 00 00 00     # 27:   1
    01 00 00 00 00 00 00 00 62  # 35:   key "b"
    05                          # 44:   list
    03 00 00 00 00 00 00 00     # 45:   3 elements
    01                          # 53:     true
    03                          # 54:     double
    00 00 00 00 00 00 04 40     # 55:     2.5
    04                          # 63:     string
    01 00 00 00 00 00 00 00 78  # 64:     string "x"
  expect:
    data:
      a: {$: int, value: 1}
      b:
        - true
        - {$: double, value: 2.5}
        - x
- name: data_minimum_reader_version_too_high
  action: decode_data
  features: [F-CRAFT-BIN-02]
  description: "Minimum reader version 3 is rejected."
  hex: |
    fe 43 52 44  # 0: data signature
    03 00        # 4: version 3
    03 00        # 6: minimum reader version 3
    01           # 8: true
  expect:
    error:
      kind: unsupportedVersion
      offset: 6
      version: 3
- name: library_signature_in_a_data_decoder
  action: decode_data
  features: [F-CRAFT-BIN-02]
  description: "A library blob is not a data blob."
  hex: |
    fe 43 52 46  # 0: library signature
    01 00        # 4: version 1
    01 00        # 6: minimum reader version 1
    01           # 8: true
  expect:
    error:
      kind: signature
      offset: 0
      version: null
- name: rfw_library_signature_in_a_data_decoder
  action: decode_data
  features: [F-CRAFT-BIN-02]
  description: "An RFW library blob is not a data blob either."
  hex: |
    fe 52 46 57              # 0: RFW library signature
    00 00 00 00 00 00 00 00  # 4: 0 imports
    00 00 00 00 00 00 00 00  # 12: 0 declarations
  expect:
    error:
      kind: signature
      offset: 0
      version: null
- name: dotted_imports
  action: encode_library
  features: [F-CRAFT-BIN-03]
  description: "Each import is a list of name parts."
  source: |
    import core;
    import acme.ui;
    widget root = Text(text: "x");
  expect:
    hex: |
      fe 43 52 46                          # 0: library signature
      01 00                                # 4: version 1
      01 00                                # 6: minimum reader version 1
      02 00 00 00 00 00 00 00              # 8: 2 imports
      01 00 00 00 00 00 00 00              # 16:   1 name part
      04 00 00 00 00 00 00 00 63 6f 72 65  # 24:   string "core"
      02 00 00 00 00 00 00 00              # 36:   2 name parts
      04 00 00 00 00 00 00 00 61 63 6d 65  # 44:   string "acme"
      02 00 00 00 00 00 00 00 75 69        # 56:   string "ui"
      01 00 00 00 00 00 00 00              # 66: 1 declaration
      04 00 00 00 00 00 00 00 72 6f 6f 74  # 74:   name "root"
      00 00 00 00 00 00 00 00              # 86:   flags
      00 00 00 00 00 00 00 00              # 94:   no initial state
      09                                   # 102:   widget call
      04 00 00 00 00 00 00 00 54 65 78 74  # 103:     name "Text"
      01 00 00 00 00 00 00 00              # 115:     1 argument
      04 00 00 00 00 00 00 00 74 65 78 74  # 123:       key "text"
      04                                   # 135:       string
      01 00 00 00 00 00 00 00 78           # 136:       string "x"
- name: exported_declaration
  action: decode_library
  features: [F-CRAFT-BIN-03]
  description: "Flag bit 0 marks the declaration exported."
  hex: |
    fe 43 52 46                             # 0: library signature
    01 00                                   # 4: version 1
    01 00                                   # 6: minimum reader version 1
    01 00 00 00 00 00 00 00                 # 8: 1 import
    01 00 00 00 00 00 00 00                 # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65     # 24:   string "core"
    01 00 00 00 00 00 00 00                 # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74     # 44:   name "root"
    01 00 00 00 00 00 00 00                 # 56:   flags 0x1
    00 00 00 00 00 00 00 00                 # 64:   no initial state
    09                                      # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74     # 73:     name "Text"
    01 00 00 00 00 00 00 00                 # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74     # 93:       key "text"
    04                                      # 105:       string
    05 00 00 00 00 00 00 00 48 65 6c 6c 6f  # 106:       string "Hello"
  expect:
    library:
      imports: [core]
      widgets:
        - name: root
          exported: true
          root:
            $: call
            name: Text
            args: {text: Hello}
- name: unknown_flag_bits_are_ignored
  action: decode_library
  features: [F-CRAFT-BIN-03]
  description: "Flag bits 1 and 63 (the sign bit) are ignored."
  hex: |
    fe 43 52 46                             # 0: library signature
    01 00                                   # 4: version 1
    01 00                                   # 6: minimum reader version 1
    01 00 00 00 00 00 00 00                 # 8: 1 import
    01 00 00 00 00 00 00 00                 # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65     # 24:   string "core"
    01 00 00 00 00 00 00 00                 # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74     # 44:   name "root"
    02 00 00 00 00 00 00 80                 # 56:   flags -9223372036854775806 (bits 1 and 63)
    00 00 00 00 00 00 00 00                 # 64:   no initial state
    09                                      # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74     # 73:     name "Text"
    01 00 00 00 00 00 00 00                 # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74     # 93:       key "text"
    04                                      # 105:       string
    05 00 00 00 00 00 00 00 48 65 6c 6c 6f  # 106:       string "Hello"
  expect:
    library:
      imports: [core]
      widgets:
        - name: root
          root:
            $: call
            name: Text
            args: {text: Hello}
- name: exported_and_private_declarations
  action: encode_library
  features: [F-CRAFT-BIN-03]
  description: "Flags are 1 for an exported declaration and 0 otherwise."
  source: |
    import core;
    export widget A = Text(text: "a");
    widget B = A();
