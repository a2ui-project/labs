      kind: invalidUtf8
      offset: 114
      version: 1
- name: extension_payload_beyond_the_end
  action: decode_library
  features: [F-CRAFT-BIN-10]
  description: "An extension payload longer than the bytes after its length."
  hex: |
    fe 43 52 46                          # 0: library signature
    01 00                                # 4: version 1
    01 00                                # 6: minimum reader version 1
    01 00 00 00 00 00 00 00              # 8: 1 import
    01 00 00 00 00 00 00 00              # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65  # 24:   string "core"
    01 00 00 00 00 00 00 00              # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74  # 44:   name "root"
    00 00 00 00 00 00 00 00              # 56:   flags 0x0
    00 00 00 00 00 00 00 00              # 64:   no initial state
    09                                   # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74  # 73:     name "Text"
    01 00 00 00 00 00 00 00              # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74  # 93:       key "text"
    80                                   # 105:       extension tag 0x80
    64 00 00 00 00 00 00 00              # 106:       payload length 100
    00                                   # 114:       1 byte
  expect:
    error:
      kind: truncated
      offset: 106
      version: 1
- name: empty_initial_state_decodes_as_none
  action: encode_library
  features: [F-CRAFT-BIN-11]
  description: "An empty initial state encodes as a count of 0, so it decodes as no initial state."
  source: |
    widget root {} = A();
  expect:
    hex: |
      fe 43 52 46                          # 0: library signature
      01 00                                # 4: version 1
      01 00                                # 6: minimum reader version 1
      00 00 00 00 00 00 00 00              # 8: 0 imports
      01 00 00 00 00 00 00 00              # 16: 1 declaration
      04 00 00 00 00 00 00 00 72 6f 6f 74  # 24:   name "root"
      00 00 00 00 00 00 00 00              # 36:   flags
      00 00 00 00 00 00 00 00              # 44:   no initial state
      09                                   # 52:   widget call
      01 00 00 00 00 00 00 00 41           # 53:     name "A"
      00 00 00 00 00 00 00 00              # 62:     0 arguments
    decoded:
      library:
        imports: []
        widgets:
          - name: root
            root:
              $: call
              name: A
              args: {}
