- name: shorter_than_a_signature
  action: decode_library
  features: [F-CRAFT-BIN-10]
  description: "A blob shorter than four bytes."
  hex: |
    fe 43  # 0: half a signature
  expect:
    error:
      kind: truncated
      offset: 2
      version: null
- name: truncated_header
  action: decode_library
  features: [F-CRAFT-BIN-10]
  description: "The minimum reader version is missing."
  hex: |
    fe 43 52 46  # 0: library signature
    01 00        # 4: version 1
  expect:
    error:
      kind: truncated
      offset: 6
      version: null
- name: string_past_the_end
  action: decode_library
  features: [F-CRAFT-BIN-10]
  description: "The last byte of a string is missing: its length is larger than the bytes after it."
  hex: |
    fe 43 52 46                          # 0: library signature
    01 00                                # 4: version 1
    01 00                                # 6: minimum reader version 1
    01 00 00 00 00 00 00 00              # 8: 1 import
    01 00 00 00 00 00 00 00              # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65  # 24:   string "core"
    01 00 00 00 00 00 00 00              # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74  # 44:   name "root"
    00 00 00 00 00 00 00 00              # 56:   flags 0x0
    00 00 00 00 00 00 00 00              # 64:   no initial state
    09                                   # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74  # 73:     name "Text"
    01 00 00 00 00 00 00 00              # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74  # 93:       key "text"
    04                                   # 105:       string
    05 00 00 00 00 00 00 00 48 65 6c 6c  # 106:       string "Hello", without its last byte
  expect:
    error:
      kind: truncated
      offset: 106
      version: 1
- name: double_past_the_end
  action: decode_data
  features: [F-CRAFT-BIN-10]
  description: "A binary64 that runs past the end is truncated at its start."
  hex: |
    fe 43 52 44  # 0: data signature
    01 00        # 4: version 1
    01 00        # 6: minimum reader version 1
    03           # 8: double
    00 00 00 00  # 9: half a binary64
  expect:
    error:
      kind: truncated
      offset: 9
      version: 1
- name: trailing_bytes_after_a_library
  action: decode_library
  features: [F-CRAFT-BIN-10]
  description: "One byte after the library."
  hex: |
    fe 43 52 46                             # 0: library signature
    01 00                                   # 4: version 1
    01 00                                   # 6: minimum reader version 1
    01 00 00 00 00 00 00 00                 # 8: 1 import
    01 00 00 00 00 00 00 00                 # 16:   1 name part
    04 00 00 00 00 00 00 00 63 6f 72 65     # 24:   string "core"
    01 00 00 00 00 00 00 00                 # 36: 1 declaration
    04 00 00 00 00 00 00 00 72 6f 6f 74     # 44:   name "root"
    00 00 00 00 00 00 00 00                 # 56:   flags 0x0
    00 00 00 00 00 00 00 00                 # 64:   no initial state
    09                                      # 72:   root: widget call
    04 00 00 00 00 00 00 00 54 65 78 74     # 73:     name "Text"
    01 00 00 00 00 00 00 00                 # 85:     1 argument
    04 00 00 00 00 00 00 00 74 65 78 74     # 93:       key "text"
    04                                      # 105:       string
    05 00 00 00 00 00 00 00 48 65 6c 6c 6f  # 106:       string "Hello"
    00                                      # 119: trailing byte
  expect:
    error:
      kind: trailingBytes
      offset: 119
      version: 1
- name: trailing_bytes_after_a_data_value
  action: decode_data
  features: [F-CRAFT-BIN-10]
  description: "One byte after the value."
  hex: |
    fe 43 52 44  # 0: data signature
    01 00        # 4: version 1
    01 00        # 6: minimum reader version 1
    01           # 8: true
    01           # 9: trailing byte
  expect:
    error:
      kind: trailingBytes
      offset: 9
      version: 1
- name: negative_length
  action: decode_library
  features: [F-CRAFT-BIN-10]
