name: a2ui_craft_flutter
description: >-
  The Flutter adapter of Craft, the client-side template system for A2UI:
  renders the expansion of a template with Flutter widgets and forwards
  their events.
version: 0.1.0-dev.1
publish_to: none
repository: https://github.com/a2ui-project/labs/tree/main/craft/packages/a2ui_craft_flutter

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  a2ui_craft:
    path: ../a2ui_craft
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
