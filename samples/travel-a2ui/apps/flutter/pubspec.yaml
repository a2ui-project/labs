name: travel_a2ui_flutter
description: >-
  The same agent, drawn by Flutter: the app around the travel catalog in
  renderers/flutter. A second client against one server, which is the claim
  the whole project exists to test.
publish_to: "none"
version: 0.1.0

environment:
  # `a2ui_flutter` 0.1.0 requires Dart >=3.10 and Flutter >=3.38.
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # The travel catalog: its views, functions and surface widget.
  travel_a2ui_renderer:
    path: ../../renderers/flutter

  # The official A2UI packages. The point of this client is that it renders the
  # protocol rather than this app's idea of it, so the core types and the
  # widget host both come from upstream.
  a2ui_core: ^0.5.0
  a2ui_flutter: ^0.1.0

  # The SDK's basic Icon draws some names from the Cupertino set; without the
  # font they render as empty boxes.
  cupertino_icons: ^1.0.8

  http: ^1.2.0

  # Removing the `#key=` fragment from the address bar on the web.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
