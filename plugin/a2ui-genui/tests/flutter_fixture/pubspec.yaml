name: my_app
description: Proves the Flutter stack file of a2ui-genui against pub.dev versions.
publish_to: "none"

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  a2ui_agent: 0.2.0
  a2ui_core: 0.6.0
  a2ui_flutter: 0.2.0
  dartantic_ai: 3.4.2
  flutter:
    sdk: flutter
  json_schema_builder: 0.1.7

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
